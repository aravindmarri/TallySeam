name: TallySeam
options:
  bundleIdPrefix: io.github.aravindmarri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TallySeam:
    type: application
    platform: iOS
    sources:
      - path: TallySeam
        excludes:
          - "Tests/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aravindmarri.tallyseam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "TallySeam"
        INFOPLIST_KEY_NSCameraUsageDescription: "TallySeam uses the camera to photograph receipts. Images stay on this iPhone."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "TallySeam uses Face ID to lock your financial data."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
  TallySeamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TallySeam/Tests
    dependencies:
      - target: TallySeam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aravindmarri.tallyseam.tests
schemes:
  TallySeam:
    build:
      targets:
        TallySeam: all
    test:
      config: Debug
      targets:
        - TallySeamTests
