name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCHEME: TallySeam
  PROJECT: TallySeam.xcodeproj
  # Must match PRODUCT_BUNDLE_IDENTIFIER in project.yml. Keeping it stable lets a re-signed
  # build install over the previous one and keep the app's data.
  EXPECTED_BUNDLE_ID: io.github.aravindmarri.tallyseam

jobs:
  build-and-test:
    name: Simulator build and tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode (needed for Apple Intelligence)
        run: |
          # The newest non-beta Xcode on the runner. Xcode 26+ includes the FoundationModels SDK;
          # with an older Xcode the app builds without Apple Intelligence.
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if [ -d "$SDK/System/Library/Frameworks/FoundationModels.framework" ]; then
            echo "::notice title=Apple Intelligence::FoundationModels is in the iOS SDK ($(xcodebuild -version | head -1)); the on-device model can be used"
          else
            echo "::warning title=Apple Intelligence::FoundationModels is not in this SDK ($(xcodebuild -version | head -1)); the app is built without Apple Intelligence"
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Static source checks
        run: python3 tools/check_sources.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "iOS" in k), key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[-1].split("-")], reverse=True)
          for runtime in ios:
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator found")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for testing
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild build-for-testing \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/logs/build.log

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/logs/test.log

      - name: Annotate errors (1-10)
        if: always()
        env:
          ANNOTATE_OFFSET: "0"
        run: python3 tools/ci_annotate.py build/logs/build.log build/logs/test.log
      - name: Annotate errors (11-20)
        if: always()
        env:
          ANNOTATE_OFFSET: "10"
        run: python3 tools/ci_annotate.py build/logs/build.log build/logs/test.log
      - name: Annotate errors (21-30)
        if: always()
        env:
          ANNOTATE_OFFSET: "20"
        run: python3 tools/ci_annotate.py build/logs/build.log build/logs/test.log

      - name: Summarize results
        if: always()
        run: |
          {
            echo "## Build and test"
            echo
            if [ -f build/logs/build.log ]; then
              echo "### Compiler errors"
              echo '```'
              grep -E "error:" build/logs/build.log | sort -u | head -50 || echo "none"
              echo '```'
            fi
            if [ -d build/TestResults.xcresult ]; then
              echo "### Test summary"
              echo '```'
              xcrun xcresulttool get test-results summary --path build/TestResults.xcresult 2>/dev/null | head -80 || echo "summary unavailable"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test counts
        if: always()
        run: |
          [ -d build/TestResults.xcresult ] || { echo "::warning::No test results bundle"; exit 0; }
          xcrun xcresulttool get test-results summary --path build/TestResults.xcresult --format json > build/summary.json || exit 0
          python3 -c '
          import json
          s = json.load(open("build/summary.json"))
          keys = ["result", "totalTestCount", "passedTests", "failedTests", "skippedTests", "expectedFailures"]
          print("::notice title=Test results::" + ", ".join(f"{k}={s.get(k)}" for k in keys))
          for f in (s.get("testFailures") or [])[:10]:
              name = f.get("testIdentifierString") or f.get("testName") or "?"
              text = (f.get("failureText") or "").replace("\n", " ")[:800]
              print(f"::error title=Failed test::{name}: {text}")'
          # Name the test that was running when a crash restarted the test process.
          if grep -q "Restarting after unexpected exit" build/logs/test.log; then
            grep -nE "Test Case '.*' started|Test case '.*' started|Restarting after unexpected exit" build/logs/test.log \
              | grep -B1 "Restarting after unexpected exit" | head -6 | sed 's/^/::error title=Crash context::/'
          fi

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-and-test-results
          path: |
            build/logs
            build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  unsigned-archive:
    name: Unsigned device archive (IPA for re-signing)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode (needed for Apple Intelligence)
        run: |
          # The newest non-beta Xcode on the runner. Xcode 26+ includes the FoundationModels SDK;
          # with an older Xcode the app builds without Apple Intelligence.
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if [ -d "$SDK/System/Library/Frameworks/FoundationModels.framework" ]; then
            echo "::notice title=Apple Intelligence::FoundationModels is in the iOS SDK ($(xcodebuild -version | head -1)); the on-device model can be used"
          else
            echo "::warning title=Apple Intelligence::FoundationModels is not in this SDK ($(xcodebuild -version | head -1)); the app is built without Apple Intelligence"
          fi

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive for iOS devices without signing
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/TallySeam.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee build/logs/archive.log

      - name: Annotate errors
        if: failure()
        run: python3 tools/ci_annotate.py build/logs/archive.log

      - name: Package unsigned IPA
        run: |
          APP=build/TallySeam.xcarchive/Products/Applications/TallySeam.app
          test -d "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../TallySeam-unsigned.ipa Payload)
          ls -lh build/TallySeam-unsigned.ipa
          {
            echo "## Unsigned IPA"
            echo
            echo "TallySeam-unsigned.ipa is NOT signed and cannot be installed on an iPhone as-is."
            echo "It must be re-signed with your own Apple Account (e.g. via Sideloadly or AltStore) before installing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify IPA is a real iPhone device build
        run: |
          set -euo pipefail
          rm -rf build/verify && mkdir -p build/verify
          unzip -q build/TallySeam-unsigned.ipa -d build/verify
          APP=build/verify/Payload/TallySeam.app
          test -f "$APP/TallySeam" || { echo "::error::Payload/TallySeam.app/TallySeam missing"; exit 1; }
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          PLATFORM=$(plutil -extract DTPlatformName raw "$APP/Info.plist")
          SUPPORTED=$(plutil -extract CFBundleSupportedPlatforms.0 raw "$APP/Info.plist")
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          BUILD=$(plutil -extract CFBundleVersion raw "$APP/Info.plist")
          MIN_OS=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")
          ARCHS=$(lipo -archs "$APP/TallySeam")
          BUILD_PLATFORM=$(vtool -show-build "$APP/TallySeam" | awk '/platform/ {print $2; exit}')
          LINKED=$(otool -L "$APP/TallySeam" | tail -n +2 | awk '{print $1}')
          echo "$LINKED"
          FAIL=0
          [ "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID" ] || { echo "::error::Bundle ID $BUNDLE_ID, expected $EXPECTED_BUNDLE_ID"; FAIL=1; }
          [ "$PLATFORM" = "iphoneos" ] || { echo "::error::DTPlatformName is $PLATFORM, expected iphoneos (device)"; FAIL=1; }
          [ "$SUPPORTED" = "iPhoneOS" ] || { echo "::error::CFBundleSupportedPlatforms is $SUPPORTED"; FAIL=1; }
          [ "$BUILD_PLATFORM" = "IOS" ] || { echo "::error::Mach-O build platform is $BUILD_PLATFORM, expected IOS (not the simulator)"; FAIL=1; }
          echo "$ARCHS" | grep -qw arm64 || { echo "::error::Binary architectures are '$ARCHS', expected arm64"; FAIL=1; }
          echo "$ARCHS" | grep -qw x86_64 && { echo "::error::Binary contains x86_64 (simulator slice)"; FAIL=1; }
          if echo "$LINKED" | grep -E '/(Network|CloudKit|WebKit)\.framework/'; then
            echo "::error::App links a networking or cloud framework"; FAIL=1
          fi
          if [ -d "$APP/Frameworks" ] && [ -n "$(ls -A "$APP/Frameworks")" ]; then
            echo "::error::App bundles third-party frameworks: $(ls "$APP/Frameworks" | xargs)"; FAIL=1
          fi
          [ "$FAIL" = 0 ] || exit 1
          DISPLAY=$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")
          ICON=$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$APP/Info.plist" 2>/dev/null || echo none)
          [ "$ICON" = "AppIcon" ] && [ -f "$APP/Assets.car" ] || { echo "::error::App icon missing (icon name '$ICON')"; exit 1; }
          [ "$DISPLAY" = "TallySeam" ] || { echo "::error::Display name is $DISPLAY, expected TallySeam"; exit 1; }
          if echo "$LINKED" | grep -q '/FoundationModels.framework/'; then
            otool -l "$APP/TallySeam" | grep -B3 FoundationModels.framework | grep -q LC_LOAD_WEAK_DYLIB \
              || { echo "::error::FoundationModels must be weak-linked so the app runs on iOS before 26"; exit 1; }
            AI="weak-linked"
          else
            AI="not included"
          fi
          SIZE=$(stat -f%z build/TallySeam-unsigned.ipa)
          echo "::notice title=IPA verified::name=$DISPLAY, icon=$ICON, appleIntelligence=$AI, bundleId=$BUNDLE_ID, version=$VERSION ($BUILD), platform=$PLATFORM/$BUILD_PLATFORM, archs=$ARCHS, minOS=$MIN_OS, bytes=$SIZE"
          {
            echo "## IPA verification"
            echo
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| Bundle ID | \`$BUNDLE_ID\` |"
            echo "| Version (build) | $VERSION ($BUILD) |"
            echo "| Platform | $PLATFORM / $BUILD_PLATFORM (device, not simulator) |"
            echo "| Architectures | $ARCHS |"
            echo "| Minimum iOS | $MIN_OS |"
            echo "| Size | $SIZE bytes |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check that debug-only diagnostic actions are not in the release build
        run: |
          BIN=build/verify/Payload/TallySeam.app/TallySeam
          if strings -a "$BIN" | grep -E "Simulate service failure|Add synthetic crash report"; then
            echo "::error::Debug-only diagnostic actions are in the release binary"; exit 1
          fi

      - name: Collect debugging symbols (dSYM)
        run: |
          D=build/TallySeam.xcarchive/dSYMs/TallySeam.app.dSYM
          test -d "$D" || { echo "::error::dSYM missing"; exit 1; }
          APP_UUID=$(dwarfdump --uuid build/verify/Payload/TallySeam.app/TallySeam | awk '{print $2}')
          SYM_UUID=$(dwarfdump --uuid "$D" | awk '{print $2}')
          [ -n "$APP_UUID" ] && [ "$APP_UUID" = "$SYM_UUID" ] || { echo "::error::dSYM $SYM_UUID does not match app $APP_UUID"; exit 1; }
          echo "::notice title=dSYM verified::uuid=$SYM_UUID, build=${{ github.run_number }}"

      - name: Upload dSYM
        uses: actions/upload-artifact@v6
        with:
          name: TallySeam-dSYM-build${{ github.run_number }}-${{ github.sha }}
          path: build/TallySeam.xcarchive/dSYMs
          retention-days: 90

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: TallySeam-unsigned-ipa
          path: build/TallySeam-unsigned.ipa
          retention-days: 14

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: archive-log
          path: build/logs
          if-no-files-found: ignore
          retention-days: 14
